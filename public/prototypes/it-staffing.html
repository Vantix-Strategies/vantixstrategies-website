<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crosstown Technical Partners — AI operations for IT staffing &amp; consulting firms</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A working prototype of an AI operations platform for an IT staffing and consulting firm, built by Vantix Strategies.">
<meta property="og:title" content="Crosstown Technical Partners — AI operations for IT staffing &amp; consulting firms">
<meta property="og:description" content="A working prototype built by Vantix Strategies.">
<meta property="og:image" content="https://www.vantixstrategies.com/opengraph-image.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  /* Layout: banner row, then sidebar + (top bar / scrolling main). Plain light console on purpose so it reads as the firm's own software. */
  :root {
    color-scheme: light;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #111827;
    --muted: #6b7280;
    --faint: #9ca3af;
    --ai: #4f46e5;
    --ai-soft: #eef2ff;
    --ai-ink: #3730a3;
    --good: #047857; --good-soft: #ecfdf5;
    --warn: #b45309; --warn-soft: #fffbeb;
    --bad: #b91c1c; --bad-soft: #fef2f2;
    --side: #ffffff; --side-ink: #374151; --side-active: #eef2ff;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
    /* Vantix modal only */
    --vx-bg: #ffffff; --vx-card: #f4f4f5; --vx-border: #e4e4e7; --vx-fg: #09090b; --vx-muted: #52525b; --vx-ring: #a1a1aa;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { color-scheme: light !important; }
  input, textarea, select { background-color: #ffffff; color: var(--text); color-scheme: light; }
  input::placeholder { color: var(--faint); }
  main, .chat-body, .side, .tbl-wrap, .drop { scrollbar-color: #cbd5e1 transparent; scrollbar-width: thin; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; font-size: inherit; cursor: pointer; color: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .shell { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

  /* Banner */
  .banner { flex: 0 0 auto; background: #fef3c7; color: #78350f; font-size: 12.5px; padding: 7px 16px; display: flex; gap: 12px; align-items: center; justify-content: center; border-bottom: 1px solid #fde68a; text-align: center; }
  .banner button { background: none; border: none; color: #78350f; font-size: 16px; line-height: 1; padding: 2px 6px; }

  .row { display: flex; flex: 1 1 auto; overflow: hidden; min-height: 0; }

  /* Sidebar */
  .side { width: 240px; flex: 0 0 240px; background: var(--side); border-right: 1px solid var(--border); color: var(--side-ink); display: flex; flex-direction: column; padding: 16px 12px; gap: 4px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 8px; background: #2563eb; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; letter-spacing: 0.02em; flex: 0 0 auto; }
  .brand-name { color: var(--text); font-weight: 600; font-size: 14px; line-height: 1.2; }
  .brand-sub { font-size: 11.5px; color: var(--muted); }
  .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: none; color: var(--side-ink); padding: 8px 10px; border-radius: 6px; font-size: 13.5px; }
  .nav-btn svg { width: 17px; height: 17px; flex: 0 0 auto; opacity: 0.85; }
  .nav-btn:hover:not(:disabled) { background: #f3f4f6; color: var(--text); }
  .nav-btn.active { background: var(--side-active); color: var(--ai-ink); font-weight: 500; }
  .nav-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .nav-badge { margin-left: auto; background: var(--ai); color: #fff; font-size: 11px; border-radius: 999px; padding: 0 7px; line-height: 18px; }
  .side-div { height: 1px; background: var(--border); margin: 10px 4px; }
  .side-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); padding: 4px 10px; }
  .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--border); }
  .avatar { width: 32px; height: 32px; border-radius: 999px; background: #e0e7ff; color: var(--ai-ink); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex: 0 0 auto; }
  .avatar.sm { width: 28px; height: 28px; font-size: 11px; }
  .me .avatar { background: #e5e7eb; color: #374151; }
  .me-name { color: var(--text); font-size: 13px; font-weight: 500; }
  .me-role { font-size: 11.5px; color: var(--muted); }
  .side-close { display: none; }

  /* Content column */
  .col { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .top { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .burger { display: none; background: none; border: 1px solid var(--border); border-radius: 6px; width: 36px; height: 36px; place-items: center; }
  .burger svg { width: 18px; height: 18px; }
  .page-title { font-size: 17px; font-weight: 600; line-height: 1.25; }
  .page-sub { font-size: 12.5px; color: var(--muted); }
  .top-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .search { position: relative; }
  .search input { width: 260px; height: 36px; border: 1px solid var(--border); border-radius: 6px; padding: 0 10px 0 32px; font: inherit; font-size: 13px; background: var(--bg); color: var(--text); }
  .search svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--faint); }
  .drop { position: absolute; right: 0; top: 42px; width: 340px; max-width: calc(100vw - 32px); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgba(15,23,42,0.12); z-index: 30; padding: 6px; }
  .drop-item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: none; padding: 8px; border-radius: 6px; }
  .drop-item:hover, .drop-item:focus-visible { background: var(--bg); }
  .drop-kind { margin-left: auto; font-size: 11px; color: var(--muted); }
  .drop-empty { padding: 10px; color: var(--muted); font-size: 13px; }
  .bell { position: relative; background: none; border: 1px solid var(--border); border-radius: 6px; width: 36px; height: 36px; display: grid; place-items: center; }
  .bell svg { width: 18px; height: 18px; color: #374151; }
  .bell .dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 999px; background: #ef4444; border: 2px solid var(--surface); }
  .note-item { padding: 10px; border-radius: 6px; font-size: 13px; }
  .note-item + .note-item { border-top: 1px solid var(--border); border-radius: 0; }
  .note-time { font-size: 11.5px; color: var(--muted); }
  main { flex: 1 1 auto; overflow-y: auto; padding: 24px; }

  /* Generic */
  .grid { display: grid; gap: 16px; }
  .g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g-2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; min-width: 0; }
  .card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-t { font-size: 14px; font-weight: 600; }
  .card-s { font-size: 12.5px; color: var(--muted); }
  .kpi-l { font-size: 12.5px; color: var(--muted); }
  .kpi-v { font-size: 24px; font-weight: 600; margin-top: 4px; letter-spacing: -0.01em; }
  .kpi-d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .kpi-d.up { color: var(--good); }
  .ai-tag { display: inline-flex; align-items: center; gap: 5px; color: var(--ai); font-size: 12px; font-weight: 500; }
  .ai-tag svg { width: 14px; height: 14px; }
  .ai-card { border-color: #c7d2fe; }
  .ai-card .card-h { color: var(--ai-ink); }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; border-radius: 999px; padding: 1px 8px; white-space: nowrap; border: 1px solid transparent; }
  .p-good { background: var(--good-soft); color: var(--good); border-color: #a7f3d0; }
  .p-warn { background: var(--warn-soft); color: var(--warn); border-color: #fde68a; }
  .p-bad { background: var(--bad-soft); color: var(--bad); border-color: #fecaca; }
  .p-ai { background: var(--ai-soft); color: var(--ai-ink); border-color: #c7d2fe; }
  .p-gray { background: #f3f4f6; color: #374151; border-color: var(--border); }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
  .btn:hover:not(:disabled) { background: var(--bg); }
  .btn.primary { background: var(--ai); border-color: var(--ai); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #4338ca; }
  .btn.sm { padding: 3px 9px; font-size: 12.5px; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn svg { width: 14px; height: 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }

  /* Radar */
  .flag { border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
  .flag + .flag { margin-top: 10px; }
  .flag-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .flag-name { font-weight: 600; }
  .why { margin: 0; padding-left: 18px; font-size: 13px; color: #374151; }
  .why li + li { margin-top: 2px; }
  .flag-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .draft-box { background: var(--ai-soft); border: 1px solid #c7d2fe; border-radius: 6px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; color: #1e1b4b; }

  /* Feed */
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .feed li:last-child { border-bottom: none; }
  .feed time { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 1px; }

  /* Chart */
  .chart svg { display: block; width: 100%; height: auto; }
  .chart text { font-family: var(--sans); font-size: 11px; fill: var(--muted); }
  .bar { fill: #c7d2fe; }
  .bar.last { fill: var(--ai); }
  .bar-hit:hover + .bar, .bar-hit:hover ~ .bar { fill: #a5b4fc; }
  .tip { position: absolute; pointer-events: none; background: var(--text); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -110%); }

  /* Tables */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; font-weight: 500; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr.hl td { background: #f5f3ff; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 180px; }
  .who-n { font-weight: 500; }
  .who-s { font-size: 12px; color: var(--muted); }

  /* Reqs */
  .reqs { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
  .req-list { display: grid; gap: 8px; }
  .req-btn { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: grid; gap: 4px; width: 100%; }
  .req-btn:hover { border-color: var(--border-strong); }
  .req-btn.sel { border-color: var(--ai); box-shadow: 0 0 0 1px var(--ai); }
  .req-id { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .req-title { font-weight: 600; }
  .req-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 12px 0 16px; }
  .fact-l { font-size: 11.5px; color: var(--muted); }
  .fact-v { font-weight: 500; }
  .skills { display: flex; gap: 6px; flex-wrap: wrap; }
  .match { border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; }
  .match + .match { margin-top: 8px; }
  .score { font-family: var(--mono); font-size: 13px; color: var(--ai-ink); background: var(--ai-soft); border-radius: 6px; padding: 4px 8px; text-align: center; min-width: 52px; }
  .score small { display: block; font-family: var(--sans); font-size: 10.5px; color: var(--ai); }
  .stages { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

  .upload { border: 1.5px dashed #a5b4fc; background: #fafaff; border-radius: 8px; padding: 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .upload-ic { width: 40px; height: 40px; border-radius: 8px; background: var(--ai-soft); color: var(--ai); display: grid; place-items: center; flex: 0 0 auto; }
  .upload-ic svg { width: 20px; height: 20px; }
  .steps { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
  .steps li { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .steps li.done { color: var(--text); }
  .steps li.done::before { content: "✓"; color: var(--good); font-weight: 600; }
  .steps li.run::before { content: ""; width: 10px; height: 10px; border: 2px solid #c7d2fe; border-top-color: var(--ai); border-radius: 999px; animation: spin 0.8s linear infinite; }
  .steps li.wait::before { content: ""; width: 10px; height: 10px; border: 2px solid var(--border); border-radius: 999px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .extract { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 16px; margin-top: 14px; }
  .extract img { width: 100%; border-radius: 6px; border: 1px solid var(--border); object-fit: cover; max-height: 200px; }
  .kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }

  /* Portal */
  .portal-head { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
  .client-logo { width: 40px; height: 40px; border-radius: 8px; background: #0e7490; color: #fff; display: grid; place-items: center; font-weight: 600; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; }
  .timeline li:last-child { border-bottom: none; }

  /* How it works */
  .hiw { display: grid; gap: 10px; max-width: 780px; }
  .hiw-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .hiw-btn { display: grid; grid-template-columns: 36px minmax(0, 1fr) 18px; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: none; padding: 14px 16px; }
  .hiw-ic { width: 36px; height: 36px; border-radius: 8px; background: var(--ai-soft); color: var(--ai); display: grid; place-items: center; }
  .hiw-ic svg { width: 18px; height: 18px; }
  .hiw-t { font-weight: 600; }
  .hiw-teaser { font-size: 13px; color: var(--ai); }
  .hiw-chev { width: 18px; height: 18px; color: var(--muted); transition: transform 0.15s ease; }
  .hiw-item.open .hiw-chev { transform: rotate(180deg); }
  .hiw-body { padding: 0 16px 16px 64px; font-size: 13.5px; color: #374151; }
  .hiw-body p { margin: 0 0 8px; max-width: 62ch; }

  /* Chat */
  .chat-fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; border-radius: 999px; background: var(--ai); color: #fff; border: none; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(79,70,229,0.35); z-index: 40; }
  .chat-fab svg { width: 22px; height: 22px; }
  .chat-hint { position: fixed; right: 82px; bottom: calc(30px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid #c7d2fe; color: var(--ai-ink); border-radius: 8px; padding: 8px 10px 8px 12px; font-size: 13px; box-shadow: 0 6px 20px rgba(15,23,42,0.1); z-index: 40; display: flex; gap: 8px; align-items: center; max-width: calc(100vw - 110px); }
  .chat-hint button { background: none; border: none; color: var(--muted); font-size: 15px; line-height: 1; }
  .chat { position: fixed; right: 20px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 380px; max-width: calc(100vw - 32px); height: 480px; max-height: calc(100% - 120px); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px rgba(15,23,42,0.18); display: flex; flex-direction: column; z-index: 41; overflow: hidden; }
  .chat-h { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .chat-h button { margin-left: auto; background: none; border: none; font-size: 18px; color: var(--muted); }
  .chat-body { flex: 1 1 auto; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 8px 11px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: var(--ai); color: #fff; border-bottom-right-radius: 3px; }
  .msg.ai { align-self: flex-start; background: #f3f4f6; color: var(--text); border-bottom-left-radius: 3px; }
  .chat-f { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
  .chat-f input { background: #ffffff; color: var(--text); flex: 1 1 auto; min-width: 0; height: 36px; border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 10px 10px; }
  .chip-q { font-size: 12px; border: 1px solid #c7d2fe; background: var(--ai-soft); color: var(--ai-ink); border-radius: 999px; padding: 3px 10px; }

  /* Modals */
  .scrim { position: fixed; inset: 0; background: rgba(15,23,42,0.35); z-index: 60; display: grid; place-items: center; padding: 16px; }
  .sheet { background: var(--surface); border-radius: 10px; width: 560px; max-width: 100%; max-height: calc(100% - 32px); overflow-y: auto; padding: 20px; }
  .vx { box-shadow: 0 20px 50px rgba(15,23,42,0.18); background: var(--vx-bg); color: var(--vx-fg); border: 1px solid var(--vx-border); border-radius: 10px; width: 540px; max-width: 100%; max-height: calc(100% - 32px); overflow-y: auto; padding: 28px; position: relative; font-weight: 300; }
  .vx-x { position: absolute; top: 14px; right: 14px; background: none; border: 1px solid var(--vx-border); color: var(--vx-muted); border-radius: 6px; width: 30px; height: 30px; font-size: 16px; line-height: 1; }
  .vx-x:hover { border-color: var(--vx-ring); color: var(--vx-fg); }
  .vx-brand { display: flex; align-items: center; gap: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; }
  .vx-brand svg { width: 20px; height: 20px; }
  .vx-brand path { fill: var(--vx-fg); }
  .vx h2 { font-size: 24px; font-weight: 300; letter-spacing: 0.03em; margin: 22px 0 8px; line-height: 1.25; text-wrap: balance; }
  .vx p { color: var(--vx-muted); margin: 0 0 14px; font-size: 14px; }
  .vx-list { list-style: none; padding: 0; margin: 18px 0; display: grid; border: 1px solid var(--vx-border); border-radius: 8px; }
  .vx-list li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px; padding: 12px 14px; font-size: 13.5px; color: var(--vx-fg); }
  .vx-list li + li { border-top: 1px solid var(--vx-border); }
  .vx-list span { font-family: var(--mono); font-size: 11.5px; color: var(--vx-muted); padding-top: 2px; }
  .vx-list em { display: block; font-style: normal; color: var(--vx-muted); font-size: 12.5px; }
  .vx-pitch { border-left: 1px solid var(--vx-ring); padding-left: 14px; color: var(--vx-fg) !important; }
  .vx-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  .vx-btn { text-transform: uppercase; letter-spacing: 0.12em; font-size: 11.5px; font-weight: 400; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--vx-border); background: transparent; color: var(--vx-fg); text-decoration: none; display: inline-flex; align-items: center; }

    setTimeout(function () { $("chat-hint").hidden = true; }, 6000);
  }

  render();
  intro();
})();
</script>
