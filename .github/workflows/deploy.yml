name: Deploy

# Merging to main ships the site.
#
#   verify ──▶ build ──▶ apply
#   (types +   (Cloud    (terraform apply, which rolls Cloud Run
#    tests)     Build)     onto the image tagged with this commit)
#
# There is no manual approval gate: the reviewed `terraform plan` posted on the
# PR (ci.yml) is the gate. Auth is keyless via Workload Identity Federation, and
# the deployer service account can only be impersonated from refs/heads/main —
# a PR branch that edits this file still cannot reach those credentials.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # re-deploy current main without a new commit

permissions:
  contents: read
  id-token: write # Workload Identity Federation

# Never let two deploys apply Terraform concurrently; queue them instead.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TF_WORKING_DIR: infra/terraform
  NODE_VERSION: "24"

jobs:
  # ── Gate: never deploy a commit that doesn't typecheck or pass tests ───────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # ── Build and push the image tagged with this commit ──────────────────────
  build:
    name: Build image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push (Cloud Build)
        run: |
          gcloud builds submit --config cloudbuild.yaml \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --substitutions=_TAG="${GITHUB_SHA}" .

  # ── Roll Cloud Run onto the new image, via Terraform ──────────────────────
  apply:
    name: Terraform apply
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -input=false

      - name: Apply (deploy image ${{ github.sha }})
        run: terraform apply -auto-approve -input=false -var="image_tag=${GITHUB_SHA}"

      - name: Summarize
        run: |
          {
            echo "### Deployed :rocket:"
            echo ""
            echo "- **URL:** $(terraform output -raw cloud_run_url)"
            echo "- **Image:** \`$(terraform output -raw deployed_image)\`"
          } >> "$GITHUB_STEP_SUMMARY"
